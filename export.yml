# Prefácio (não aparece no site, só no PDF)
      preface_place: Juazeiro do Norte, CE, Brasil
      preface_date: outubro de 2026
      preface_signature: Daniel Lacerda Loiola
      preface: |
        Quantos guardas são necessários para vigiar um museu? A pergunta, feita pelo matemático Victor Klee em 1973, deu origem a um dos problemas clássicos da geometria computacional: o Problema da Galeria de Arte. Seu enunciado é simples o bastante para ser compreendido por qualquer estudante, e é justamente essa simplicidade que o torna um ponto de partida tão rico para o ensino de geometria.

        Este material contém o produto educacional da dissertação “Guardas no Museu: explorando o problema da galeria de arte para o ensino de geometria”, apresentada ao Programa de Pós-Graduação em Matemática em Rede Nacional da Universidade Federal do Cariri. O produto é o jogo de tabuleiro O Grande Vernissage, no qual cada jogador é curador de uma galeria de arte e precisa instalar câmeras de segurança, adquirir obras e cumprir contratos para acumular prestígio.

        No jogo, a galeria é uma malha quadriculada com paredes internas, e cada câmera é um poliminó que representa a região que ela enxerga. Ao posicionar as peças, disputar as obras e perseguir os contratos, os estudantes mobilizam noções de visibilidade, polígonos, vértices, ângulos, área, perímetro e simetria, sem que seja necessária uma formalização prévia. A matemática está na própria mecânica do jogo.

        O material está organizado para quem vai jogar e para quem vai ensinar. Os primeiros capítulos trazem as regras, o baralho de contratos, as obras de arte e uma referência rápida para consulta durante a partida. Em seguida, há orientações para a confecção do material na escola e um guia de aplicação com sequência didática, perguntas para a discussão em sala e o mapeamento das habilidades da Base Nacional Comum Curricular.

        Esperamos que este jogo possa ser adaptado à realidade de cada turma e que o professor, como mediador, encontre nele uma forma de fazer os estudantes descobrirem, jogando, que há muita geometria por trás de uma pergunta aparentemente simples.
      preface_acknowledgments: |
        Agradeço ao meu orientador, Prof. Dr. Vicente Helano Feitosa Batista Sobrinho, pela paciência, dedicação e ensinamentos transmitidos ao longo desta jornada, e ao coorientador, Prof. Dr. Roberto Hugo Wanderley Pinheiro, pela disponibilidade e principalmente pelas dicas oferecidas ao produto deste trabalho.

        Agradeço também à Universidade Federal do Cariri (UFCA) e ao Programa de Pós-Graduação em Matemática em Rede Nacional (PROFMAT) pelo espaço de formação e pesquisa que possibilitou a construção deste produto educacional.

